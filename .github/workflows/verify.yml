name: Verify

on:
  pull_request:
  push:
    branches:
      - main
      - experiment_stability
      - "refactor/**"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare Gradle distribution
        run: |
          for attempt in 1 2 3; do
            if ./gradlew --version; then
              exit 0
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "Gradle distribution download failed after $attempt attempts." >&2
              exit 1
            fi
            sleep_seconds=$((attempt * 10))
            echo "Gradle download failed; retrying in ${sleep_seconds}s..." >&2
            sleep "$sleep_seconds"
          done
      - run: ./scripts/verify.sh

  native:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      NDK_VERSION: 25.2.9519653
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install native toolchain
        run: $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "ndk;$NDK_VERSION"
      - name: Verify packaged artifact
        run: ./scripts/verify-native-artifact.sh
      - name: Compile native probe
        run: NDK="$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" ./scripts/build-native-probe.sh "$RUNNER_TEMP/cellidtracker-native"

  instrumentation:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare Gradle distribution
        run: |
          for attempt in 1 2 3; do
            if ./gradlew --version; then
              exit 0
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "Gradle distribution download failed after $attempt attempts." >&2
              exit 1
            fi
            sleep_seconds=$((attempt * 10))
            echo "Gradle download failed; retrying in ${sleep_seconds}s..." >&2
            sleep "$sleep_seconds"
          done
      - name: Run database migration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest -PGOOGLE_API_KEY=phase0-verification-placeholder
